[project]
name = "weather-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas", "pyarrow", "requests", "boto3", "python-dotenv", "duckdb>=2.0"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]